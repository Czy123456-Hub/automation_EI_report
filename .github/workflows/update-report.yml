name: Update El Nino Report

on:
  schedule:
    # 08:17 Beijing time = 00:17 UTC
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-el-nino-report
  cancel-in-progress: true

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate report
        env:
          EL_NINO_OUTPUT_DIR: .runtime
          EL_NINO_OUTPUT_HTML: index.html
        run: python3 run_el_nino_tracker.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No report changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update El Nino tracker HTML - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Prepare Pages artifact
        run: |
          rm -rf .site
          mkdir -p .site
          cp index.html .site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
